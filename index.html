function lookupTest(code,name){
    var c=(code||'').toUpperCase().trim(),nm=(name||'').toUpperCase().trim();
    function res(k){var a=ALIAS[k];if(a&&DB[a])return DB[a];if(DB[k])return DB[k];return null}
    var f=res(c)||res(nm);
    if(f)return f;
    var keys=Object.keys(DB).concat(Object.keys(ALIAS));
    for(var i=0;i<keys.length;i++){var k=keys[i];if(c.indexOf(k)>=0||nm.indexOf(k)>=0||k.indexOf(c)>=0||(nm&&k.indexOf(nm)>=0)){f=res(k);if(f)return f}}
    return null;
}

function genResults(code,name){
    var tpl=lookupTest(code,name);
    if(tpl)return tpl.map(function(t){var v=String(t.gv());return{code:t.c,name:t.n,value:v,unit:t.u,range:t.r,status:t.gs(v)}});
    var v=(Math.random()*80+10).toFixed(1);
    return[{code:code||'RESULT',name:name||'Test Result',value:v,unit:'units',range:'10-90',status:(parseFloat(v)>=10&&parseFloat(v)<=90)?'N':'A'}];
}

                        ce('h5',{style:{color:'#166534',marginBottom:'.5rem'}},'Generated Order Details'),
                        ce('p',{style:{margin:'.25rem 0'}},ce('strong',null,'Order Number: '),uploadedOrder.orderInfo.orderNumber),
                        ce('p',{style:{margin:'.25rem 0'}},ce('strong',null,'Provider: '),'Dr. '+uploadedOrder.orderInfo.physicianFirstName+' '+uploadedOrder.orderInfo.physicianLastName),
                        ce('p',{style:{margin:'.25rem 0'}},ce('strong',null,'Tests: '),uploadedOrder.labTests.length+' test(s)')
                    ),
                    ce('div',{style:{background:'#fffbeb',padding:'1rem',borderRadius:'8px'}},
                        ce('h5',{style:{color:'#92400e',marginBottom:'.5rem'}},'Generated Tests'),
                        ce('ul',{style:{marginLeft:'1rem'}},uploadedOrder.labTests.map(function(t,i){return ce('li',{key:i,style:{marginBottom:'.25rem',fontSize:'.875rem'}},ce('strong',null,t.code),': '+t.name+' ('+t.results.length+' result(s))')}))
                    )
                )
            )
        )
    }

    function renderUploadedOrder(){
        if(!uploadedOrder)return null;
        var pi=uploadedOrder.patientInfo,oi=uploadedOrder.orderInfo;
        return ce('div',null,
            ce('h2',{className:'mb-4'},'Loaded Information - Complete HL7 Details'),
            extractedFiles.length>0&&ce('div',{className:'file-card',style:{cursor:'pointer'},onClick:function(){setCurrentModule('files')}},ce('h4',null,extractedFiles.length+' Embedded File(s) Found - Click to View/Download')),
            ce('div',{className:'info-card',style:{background:'#eff6ff'}},
                ce('h4',{style:{color:'#1e40af'}},'Patient Information (PID)'),
                ce('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'1rem'}},
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Full Name: '),pi.firstName+' '+(pi.middleName?pi.middleName+' ':'')+pi.lastName),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'MRN: '),pi.mrn),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Birth Date: '),pi.birthDate),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Gender: '),pi.gender),
                    ce('div',{style:{fontSize:'.875rem',gridColumn:'span 2'}},ce('strong',null,'Address: '),pi.address1!=='Unknown'?pi.address1+', '+pi.city+', '+pi.state+' '+pi.zip:'Not available'),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Home Phone: '),pi.phoneHome!=='(000) 000-0000'?pi.phoneHome:'Not provided'),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'SSN: '),pi.ssn||'N/A')
                )
            ),
            ce('div',{className:'info-card',style:{background:'#f0fdf4'}},
                ce('h4',{style:{color:'#166534'}},'Message Header (MSH)'),
                ce('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'1rem'}},
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Message Type: '),oi.messageType),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'HL7 Version: '),oi.hl7Version),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Sending App: '),oi.sendingApp),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Sending Facility: '),oi.sendingFacility),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Receiving App: '),oi.receivingApp),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Receiving Facility: '),oi.receivingFacility),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Date/Time: '),oi.orderDateTime),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Control ID: '),oi.controlId)
                )
            ),
            ce('div',{className:'info-card',style:{background:'#fef3c7'}},
                ce('h4',{style:{color:'#92400e'}},'Order Control (ORC)'),
                ce('div',{style:{background:'#fef9c3',padding:'.75rem',borderRadius:'6px'}},ce('strong',null,'Order Number: '+(oi.orderNumber||'N/A')))
            ),
            ce('div',{className:'info-card',style:{background:'#faf5ff'}},
                ce('h4',{style:{color:'#6b21a8'}},'Ordering Physician'),
                ce('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'1rem'}},
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'NPI: '),oi.physicianNPI||'N/A'),
                    ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Name: '),'Dr. '+(oi.physicianFirstName||'Unknown')+' '+(oi.physicianLastName||'Physician'))
                )
            ),
            ce('div',{style:{background:'#fffbeb',padding:'2rem',borderRadius:'12px',marginBottom:'2rem'}},
                ce('h4',{style:{color:'#92400e',fontWeight:600,marginBottom:'1rem'}},'Laboratory Order Requests (OBR) - '+uploadedOrder.labTests.length+' test(s)'),
                uploadedOrder.labTests.map(function(test,index){
                    return ce('div',{key:index,style:{background:'#fff',padding:'1.5rem',borderRadius:'8px',marginBottom:'1rem',border:'1px solid #e5e7eb'}},
                        ce('h5',{style:{color:'#92400e',marginBottom:'1rem',borderBottom:'2px solid #fed7aa',paddingBottom:'.5rem'}},'Test #'+test.sequence+': '+(test.name||'Lab Test')),
                        ce('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'1rem',marginBottom:'1rem'}},
                            ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Test Code: '),test.code),
                            ce('div',{style:{fontSize:'.875rem'}},ce('strong',null,'Test Name: '),test.name)
                        ),
                        ce('div',{style:{marginTop:'1rem',background:'#fef3c7',padding:'1rem',borderRadius:'6px'}},
                            ce('strong',null,'Results ('+test.results.length+'):'),
                            ce('table',{style:{width:'100%',marginTop:'.5rem',fontSize:'.875rem',borderCollapse:'collapse'}},
                                ce('thead',null,ce('tr',{style:{borderBottom:'1px solid #d97706'}},
                                    ce('th',{style:{textAlign:'left',padding:'.25rem .5rem'}},'Code'),
                                    ce('th',{style:{textAlign:'left',padding:'.25rem .5rem'}},'Name'),
                                    ce('th',{style:{textAlign:'right',padding:'.25rem .5rem'}},'Value'),
                                    ce('th',{style:{textAlign:'left',padding:'.25rem .5rem'}},'Unit'),
                                    ce('th',{style:{textAlign:'left',padding:'.25rem .5rem'}},'Range'),
                                    ce('th',{style:{textAlign:'center',padding:'.25rem .5rem'}},'Flag')
                                )),
                                ce('tbody',null,test.results.map(function(r,idx){
                                    var flagColor=r.status==='N'?'#166534':r.status==='A'||r.status==='H'||r.status==='L'?'#dc2626':'#92400e';
                                    return ce('tr',{key:idx,style:{borderBottom:'1px solid #fde68a'}},
                                        ce('td',{style:{padding:'.25rem .5rem',fontWeight:600}},r.code),
                                        ce('td',{style:{padding:'.25rem .5rem'}},r.name),
                                        ce('td',{style:{padding:'.25rem .5rem',textAlign:'right',fontWeight:600,color:flagColor}},r.value),
                                        ce('td',{style:{padding:'.25rem .5rem',color:'#78350f'}},r.unit),
                                        ce('td',{style:{padding:'.25rem .5rem',color:'#78350f'}},r.range),
                                        ce('td',{style:{padding:'.25rem .5rem',textAlign:'center',fontWeight:700,color:flagColor}},r.status==='N'?'N':r.status)
                                    )
                                }))
                            )
                        )
                    )
                })
            ),
            ce('div',{className:'text-center'},ce('button',{className:'btn-green',style:{padding:'1rem 2rem',fontSize:'1.125rem'},onClick:handleGenResult},'Generate HL7 ORU^R01 Result'))
        )
    }

    function renderContent(){
        if(currentModule==='files')return renderFiles();
        if(currentModule==='loaded-info'&&uploadedOrder)return renderUploadedOrder();
        if(currentModule==='result-from-order'){
            if(!uploadedOrder)return ce('div',{className:'text-center'},ce('h2',{className:'mb-4'},'Result from Order'),ce('div',{className:'info-card'},ce('p',{style:{color:'#ef4444',textAlign:'center'}},'No order uploaded yet.')));
            return ce('div',null,ce('h2',{className:'mb-4'},'Result from Order'),ce('div',{className:'info-card'},
                ce('h4',null,'Current Loaded Order'),
                ce('p',null,ce('strong',null,'Patient: '),uploadedOrder.patientInfo.firstName+' '+uploadedOrder.patientInfo.lastName),
                ce('p',{style:{marginTop:'.5rem'}},ce('strong',null,'Tests: '),uploadedOrder.labTests.map(function(t){return t.name}).join(', ')),
                ce('button',{className:'btn-green',style:{width:'100%',padding:'1rem',marginTop:'1rem'},onClick:handleGenResult},'Generate Lightning Step Compliant Result')
            ));
        }
        if(currentModule==='random-tests')return renderPatientSelector('Random Tests - Keep Original Demographics','RL');
        if(currentModule==='random-name-dob')return renderPatientSelector('Name + DOB Only','ND');
        if(currentModule==='random-v231')return renderPatientSelector('Random Demographics v2.3.1','RD','2.3.1');
        if(currentModule==='random-v23')return renderPatientSelector('Random Demographics v2.3','R3','2.3');
        return renderHome();
    }

    function renderResults(){
        return ce('div',{className:'results-section'},
            ce('h2',{className:'mb-4'},'Lightning Step Compliant HL7 ORU^R01 Result'),
            ce('p',{className:'mb-4'},'Generated laboratory results in Lightning Step compliant HL7 format'),
            generatedResult&&ce('button',{className:'btn-indigo mb-4',style:{padding:'.75rem 1.5rem'},onClick:handleDownload},'Download HL7 File'),
            ce('div',{className:'result-display'},generatedResult||'Select a module and generate results to see the Lightning Step compliant HL7 format...')
        )
    }

    return ce('div',{className:'container'},
        ce('div',{className:'card'},
            renderHeader(),
            ce('input',{ref:fileInputRef,type:'file',accept:'.hl7,.txt',onChange:handleFileUpload,style:{display:'none'}}),
            ce('div',{className:'content'},renderContent()),
            renderResults()
        )
    )
}

var container=document.getElementById('root');createRoot(container).render(ce(HL7Generator));
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initApp);else initApp();
</script>
</body>
</html>
