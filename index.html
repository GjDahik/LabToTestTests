<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HL7 Results Generator - Lightning Step Compliant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; }
        
        .container { min-height: 100vh; background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%); padding: 2rem; }
        .card { max-width: 1200px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 25px 50px rgba(0,0,0,0.1); overflow: hidden; }
        
        .header { background: linear-gradient(90deg, #2563eb 0%, #4f46e5 100%); padding: 2rem; color: white; }
        .header h1 { font-size: 2rem; font-weight: bold; margin-bottom: 0.5rem; }
        .header p { opacity: 0.9; }
        
        .nav { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
        .nav button { padding: 0.75rem 1rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.875rem; font-weight: 500; transition: all 0.2s; }
        .nav button:hover { opacity: 0.9; }
        .nav button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-orange { background: #f97316; color: white; }
        .btn-purple { background: #a855f7; color: white; }
        .btn-teal { background: #14b8a6; color: white; }
        .btn-emerald { background: #10b981; color: white; }
        .btn-gray { background: #6b7280; color: white; }
        .btn-green { background: #16a34a; color: white; }
        .btn-blue { background: #2563eb; color: white; }
        .btn-indigo { background: #4f46e5; color: white; }
        .btn-pink { background: #ec4899; color: white; }
        
        .content { padding: 3rem; }
        .results-section { background: #f9fafb; border-top: 1px solid #e5e7eb; padding: 3rem; text-align: center; }
        
        .info-card { background: #eff6ff; padding: 2rem; border-radius: 12px; margin-bottom: 2rem; }
        .info-card h4 { color: #1e40af; font-weight: 600; margin-bottom: 1rem; font-size: 1.125rem; }
        
        .file-card { background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%); border: 2px solid #f9a8d4; padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; }
        .file-card h4 { color: #be185d; margin-bottom: 0.5rem; }
        .file-item { background: white; border: 1px solid #f9a8d4; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; }
        
        .result-display { background: #111827; color: #4ade80; font-family: monospace; padding: 1.5rem; border-radius: 8px; 
                         overflow-x: auto; max-height: 400px; white-space: pre-wrap; font-size: 0.875rem; margin: 1rem 0; }
        
        .compliance-badge { background: #10b981; color: white; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .file-badge { background: #ec4899; color: white; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-left: 0.5rem; }
        
        .text-center { text-align: center; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        
        select, input { padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
        select { width: 100%; margin-bottom: 1rem; }
        
        @media (max-width: 768px) {
            .nav { flex-direction: column; }
            .content { padding: 1.5rem; }
            .results-section { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
            Loading HL7 Results Generator...
        </div>
    </div>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <script>
        function initApp() {
            if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
                document.getElementById('root').innerHTML = '<div style="text-align:center;padding:2rem;">Error loading React</div>';
                return;
            }

            const { useState, useRef } = React;
            const { createRoot } = ReactDOM;

            function HL7Generator() {
                const [uploadedOrder, setUploadedOrder] = useState(null);
                const [generatedResult, setGeneratedResult] = useState('');
                const [knownPatients, setKnownPatients] = useState([]);
                const [currentModule, setCurrentModule] = useState('home');
                const [selectedPatient, setSelectedPatient] = useState(null);
                const [extractedFiles, setExtractedFiles] = useState([]);
                const [previewFile, setPreviewFile] = useState(null);
                const fileInputRef = useRef(null);

                function generateESTDateTime() {
                    const now = new Date();
                    const estOffset = -5;
                    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                    const est = new Date(utc + (estOffset * 3600000));
                    return est.getFullYear() + String(est.getMonth() + 1).padStart(2, '0') + String(est.getDate()).padStart(2, '0') +
                           String(est.getHours()).padStart(2, '0') + String(est.getMinutes()).padStart(2, '0') + String(est.getSeconds()).padStart(2, '0');
                }

                // NEW: Extract embedded files (PDF, JPG, PNG, etc.)
                function extractEmbeddedFiles(hl7Content) {
                    const files = [];
                    let lines = hl7Content.split(/\r?\n/).filter(l => l.trim());
                    if (lines.length === 1) {
                        const segs = lines[0].split(/(MSH|PID|PV1|IN1|IN2|GT1|ORC|OBR|OBX|NTE|DG1)/).filter(Boolean);
                        lines = [];
                        for (let i = 0; i < segs.length; i += 2) {
                            if (segs[i] && segs[i+1]) lines.push(segs[i] + segs[i+1]);
                        }
                    }
                    
                    lines.filter(l => l.startsWith('OBX')).forEach((obx, idx) => {
                        const f = obx.split('|');
                        const dt = f[2] || '', obsId = f[3] || '', val = f[5] || '';
                        const obsIdParts = obsId.split('^');
                        let mimeHint = obsIdParts.length > 1 ? obsIdParts[1].toLowerCase() : '';
                        
                        function detectType(b64) {
                            try {
                                const dec = atob(b64.substring(0, 30));
                                if (dec.startsWith('%PDF')) return { mime: 'application/pdf', ext: 'pdf', label: 'PDF Document' };
                                if (dec.charCodeAt(0) === 0xFF && dec.charCodeAt(1) === 0xD8) return { mime: 'image/jpeg', ext: 'jpg', label: 'JPG Image' };
                                if (dec.substring(1, 4) === 'PNG') return { mime: 'image/png', ext: 'png', label: 'PNG Image' };
                                if (dec.substring(0, 4) === 'GIF8') return { mime: 'image/gif', ext: 'gif', label: 'GIF Image' };
                            } catch(e) {}
                            if (mimeHint.includes('jpg') || mimeHint.includes('jpeg')) return { mime: 'image/jpeg', ext: 'jpg', label: 'JPG Image' };
                            if (mimeHint.includes('png')) return { mime: 'image/png', ext: 'png', label: 'PNG Image' };
                            if (mimeHint.includes('pdf')) return { mime: 'application/pdf', ext: 'pdf', label: 'PDF Document' };
                            if (mimeHint.includes('gif')) return { mime: 'image/gif', ext: 'gif', label: 'GIF Image' };
                            return { mime: 'application/octet-stream', ext: 'bin', label: 'Binary File' };
                        }
                        
                        if (dt === 'ED' && val.length > 100) {
                            const parts = val.split('^');
                            let b64 = parts.length >= 4 ? parts.slice(3).join('^') : parts[parts.length-1];
                            b64 = b64.replace(/[\r\n\s]/g, '');
                            if (b64.length > 100) {
                                const fileType = detectType(b64);
                                files.push({ idx: idx+1, segIdx: f[1]||String(idx+1), type: dt, b64, size: Math.round(b64.length*3/4/1024), ...fileType });
                            }
                        }
                        else if (dt === 'ST' && val.length > 500) {
                            const clean = val.replace(/[\r\n\s]/g, '');
                            if (/^[A-Za-z0-9+/]+=*$/.test(clean) || clean.startsWith('/9j/')) {
                                const fileType = detectType(clean);
                                files.push({ idx: idx+1, segIdx: f[1]||String(idx+1), type: 'ST (Base64)', b64: clean, size: Math.round(clean.length*3/4/1024), ...fileType });
                            }
                        }
                        else if (dt === 'TX' && val.length > 500) {
                            const clean = val.replace(/[\r\n\s]/g, '');
                            if (/^[A-Za-z0-9+/]+=*$/.test(clean)) {
                                const fileType = detectType(clean);
                                files.push({ idx: idx+1, segIdx: f[1]||String(idx+1), type: 'TX (Base64)', b64: clean, size: Math.round(clean.length*3/4/1024), ...fileType });
                            }
                        }
                    });
                    return files;
                }

                function downloadFile(file) {
                    try {
                        const bytes = atob(file.b64);
                        const arr = new Uint8Array(bytes.length);
                        for (let j = 0; j < bytes.length; j++) arr[j] = bytes.charCodeAt(j);
                        const blob = new Blob([arr], { type: file.mime });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = 'HL7_' + file.label.replace(/ /g, '_') + '_' + file.segIdx + '.' + file.ext;
                        a.click();
                        URL.revokeObjectURL(a.href);
                    } catch(e) { alert('Error downloading: ' + e.message); }
                }

                function generateRandomTests() {
                    const availableTests = [
                        { code: 'CBC001', name: 'Complete Blood Count', results: [
                            { code: 'WBC', name: 'White Blood Count', value: (Math.random() * 7 + 4).toFixed(1), unit: '10*3/uL', range: '4.0-11.0', status: 'N' },
                            { code: 'RBC', name: 'Red Blood Count', value: (Math.random() * 1.5 + 3.5).toFixed(1), unit: '10*6/uL', range: '3.5-5.0', status: 'N' },
                            { code: 'HGB', name: 'Hemoglobin', value: (Math.random() * 4 + 12).toFixed(1), unit: 'g/dL', range: '12.0-16.0', status: 'N' }
                        ]},
                        { code: 'CMP001', name: 'Comprehensive Metabolic Panel', results: [
                            { code: 'GLU', name: 'Glucose', value: Math.floor(Math.random() * 30 + 70).toString(), unit: 'mg/dL', range: '70-100', status: 'N' },
                            { code: 'BUN', name: 'Blood Urea Nitrogen', value: Math.floor(Math.random() * 15 + 7).toString(), unit: 'mg/dL', range: '7-22', status: 'N' },
                            { code: 'CREAT', name: 'Creatinine', value: (Math.random() * 0.8 + 0.6).toFixed(2), unit: 'mg/dL', range: '0.6-1.4', status: 'N' }
                        ]},
                        { code: 'LIPID001', name: 'Lipid Panel', results: [
                            { code: 'CHOL', name: 'Total Cholesterol', value: Math.floor(Math.random() * 100 + 150).toString(), unit: 'mg/dL', range: '<200', status: 'N' },
                            { code: 'HDL', name: 'HDL Cholesterol', value: Math.floor(Math.random() * 40 + 35).toString(), unit: 'mg/dL', range: '>40', status: 'N' },
                            { code: 'LDL', name: 'LDL Cholesterol', value: Math.floor(Math.random() * 70 + 80).toString(), unit: 'mg/dL', range: '<100', status: 'N' }
                        ]}
                    ];
                    const numTests = Math.floor(Math.random() * 3) + 1;
                    const selectedTests = [];
                    const usedIndices = new Set();
                    while (selectedTests.length < numTests && selectedTests.length < availableTests.length) {
                        const index = Math.floor(Math.random() * availableTests.length);
                        if (!usedIndices.has(index)) {
                            usedIndices.add(index);
                            selectedTests.push({ ...availableTests[index], sequence: selectedTests.length + 1 });
                        }
                    }
                    return selectedTests;
                }

                function parseHL7Order(hl7Content) {
                    try {
                        const files = extractEmbeddedFiles(hl7Content);
                        setExtractedFiles(files);
                        
                        let lines = hl7Content.split(/\r?\n/).filter(line => line.trim());
                        if (lines.length === 1) {
                            const singleLine = lines[0];
                            const segments = singleLine.split(/(MSH|PID|PV1|IN1|IN2|GT1|ORC|OBR|DG1)/).filter(Boolean);
                            lines = [];
                            for (let i = 0; i < segments.length; i += 2) {
                                if (segments[i] && segments[i + 1]) lines.push(segments[i] + segments[i + 1]);
                            }
                        }
                        
                        const pidSegment = lines.find(line => line.startsWith('PID'));
                        const mshSegment = lines.find(line => line.startsWith('MSH'));
                        const pv1Segment = lines.find(line => line.startsWith('PV1'));
                        const in1Segment = lines.find(line => line.startsWith('IN1'));
                        const orcSegments = lines.filter(line => line.startsWith('ORC'));
                        const obrSegments = lines.filter(line => line.startsWith('OBR'));

                        let patientInfo = { mrn: 'Unknown', lastName: 'Unknown', firstName: 'Patient', middleName: '', birthDate: '19900101', gender: 'U', address1: 'Unknown', city: 'Unknown', state: 'XX', zip: '00000', phoneHome: '(000) 000-0000', phoneBusiness: '(000) 000-0000', race: 'White', maritalStatus: 'U', ssn: 'N/A', accountNumber: 'N/A' };

                        if (pidSegment) {
                            const fields = pidSegment.split('|');
                            if (fields.length > 5) {
                                const nameField = fields[5] || '';
                                const nameParts = nameField.split('^');
                                const addressField = fields[11] || '';
                                const addressParts = addressField.split('^');
                                patientInfo = {
                                    mrn: fields[3] || 'Unknown', lastName: nameParts[0] || 'Unknown', firstName: nameParts[1] || 'Patient', middleName: nameParts[2] || '',
                                    birthDate: fields[7] || '19900101', gender: fields[8] || 'U', address1: addressParts[0] || 'Unknown', city: addressParts[2] || 'Unknown',
                                    state: addressParts[3] || 'XX', zip: addressParts[4] || '00000', phoneHome: fields[13] || '(000) 000-0000', phoneBusiness: fields[14] || '(000) 000-0000',
                                    race: 'White', maritalStatus: fields[16] || 'U', ssn: fields[19] || 'N/A', accountNumber: fields[18] || 'N/A'
                                };
                            }
                        }

                        let orderInfo = { orderNumber: 'UNKNOWN', sendingApp: 'LightningStep', sendingFacility: '73929332', receivingApp: 'ClinicalLabs', receivingFacility: 'LABLIS', orderDateTime: generateESTDateTime(), controlId: 'UNKNOWN', messageType: 'ORM^O01', processingId: 'P', hl7Version: '2.3.1', physicianNPI: 'Unknown', physicianFirstName: 'Unknown', physicianLastName: 'Unknown' };

                        if (mshSegment) {
                            const fields = mshSegment.split('|');
                            orderInfo = { ...orderInfo, sendingApp: fields[3] || 'LightningStep', sendingFacility: fields[4] || '73929332', receivingApp: fields[5] || 'ClinicalLabs', receivingFacility: fields[6] || 'LABLIS', orderDateTime: fields[7] || generateESTDateTime(), messageType: fields[9] || 'ORM^O01', controlId: fields[10] || 'UNKNOWN', processingId: fields[11] || 'P', hl7Version: fields[12] || '2.3.1' };
                        }

                        if (orcSegments.length > 0) {
                            const orcFields = orcSegments[0].split('|');
                            orderInfo.orderControl = orcFields[1] || 'NW';
                            orderInfo.placerOrderNumber = orcFields[2] || 'UNKNOWN';
                            orderInfo.fillerOrderNumber = orcFields[3] || 'UNKNOWN';
                            orderInfo.orderNumber = orcFields[2] || orcFields[3] || 'UNKNOWN';
                        }

                        let visitInfo = { patientClass: 'O', assignedLocation: '^^^&', visitNumber: Math.floor(Math.random() * 999) + 1 };
                        if (pv1Segment) {
                            const fields = pv1Segment.split('|');
                            visitInfo = { patientClass: fields[2] || 'O', assignedLocation: fields[3] || '^^^&', visitNumber: fields[19] || Math.floor(Math.random() * 999) + 1 };
                        }

                        let insuranceInfo = {};
                        if (in1Segment) {
                            const fields = in1Segment.split('|');
                            insuranceInfo = { planId: fields[2] || 'N/A', companyName: fields[4] || 'N/A', policyNumber: fields[36] || 'N/A', groupNumber: fields[8] || 'N/A' };
                        }

                        const labTests = obrSegments.length > 0 ? obrSegments.map((obr, index) => {
                            const fields = obr.split('|');
                            const testInfo = fields[4] || '';
                            const testParts = testInfo.split('^');
                            const physicianInfo = fields[16] || '';
                            const physicianParts = physicianInfo.split('^');
                            if (index === 0 && physicianInfo) {
                                orderInfo.physicianNPI = physicianParts[0] || 'Unknown';
                                orderInfo.physicianLastName = physicianParts[1] || 'Unknown';
                                orderInfo.physicianFirstName = physicianParts[2] || 'Unknown';
                            }
                            return {
                                sequence: index + 1, code: testParts[0] || 'UNKNOWN_CODE_' + (index + 1), name: testParts[1] || 'Unknown Test ' + (index + 1),
                                priority: fields[5] || 'R', requestedDateTime: fields[6] || generateESTDateTime(), collectionDateTime: fields[7] || generateESTDateTime(),
                                results: testParts[1] ? [{ code: testParts[0] || 'RESULT', name: testParts[1] || 'Test Result', value: 'Pending', unit: 'N/A', range: 'N/A', status: 'P' }] : generateRandomTests()[0].results
                            };
                        }) : generateRandomTests();

                        return { success: true, patientInfo, orderInfo, visitInfo, insuranceInfo, labTests, originalHL7: hl7Content, embeddedFiles: files };
                    } catch (error) {
                        return { success: false, error: error.message };
                    }
                }

                function generateResultHL7() {
                    if (!uploadedOrder) return '';
                    const patientInfo = uploadedOrder.patientInfo;
                    const orderInfo = uploadedOrder.orderInfo;
                    const labTests = uploadedOrder.labTests;
                    const resultDateTime = generateESTDateTime();
                    const controlId = Math.floor(Math.random() * 900000000000000000000) + 100000000000000000000;
                    const version = uploadedOrder.useV23 ? '2.3' : '2.3.1';
                    
                    let hl7Result = '';
                    hl7Result += 'MSH|^~\\&|LightningStep|' + (orderInfo.sendingFacility || '73929332') + '|ClinicalLabs|' + (orderInfo.receivingFacility || 'LABLIS') + '|' + resultDateTime + '||ORU^R01|' + controlId + '|P|' + version + '|||NE|NE\r\n';
                    
                    const raceCode = '2106-3^White^CDCREC';
                    const ethnicityCode = Math.random() > 0.5 ? '2135-2^Hispanic or Latino' : '2186-5^Not Hispanic or Latino';
                    const billType = uploadedOrder.insuranceInfo && Object.keys(uploadedOrder.insuranceInfo).length > 0 ? 'T' : 'P';
                    
                    hl7Result += 'PID|1|' + patientInfo.mrn + '|' + patientInfo.mrn + '||' + patientInfo.lastName + '^' + patientInfo.firstName + '^' + (patientInfo.middleName || '') + '||' + patientInfo.birthDate + '|' + patientInfo.gender + '||' + raceCode + '|' + (patientInfo.address1 !== 'Unknown' ? patientInfo.address1 : '12345 Fake Address Rd.') + '^^' + (patientInfo.city !== 'Unknown' ? patientInfo.city : 'Spring') + '^' + (patientInfo.state !== 'XX' ? patientInfo.state : 'TX') + '^' + (patientInfo.zip !== '00000' ? patientInfo.zip : '77778') + '||' + (patientInfo.phoneHome !== '(000) 000-0000' ? patientInfo.phoneHome : '(832) 454-4545') + '|' + (patientInfo.phoneBusiness !== '(000) 000-0000' ? patientInfo.phoneBusiness : '(832) 454-4545') + '||||' + patientInfo.mrn + '^^^' + billType + '|' + (patientInfo.ssn !== 'N/A' ? patientInfo.ssn : '') + '|||' + ethnicityCode + '|\r\n';
                    
                    const visitInfo = uploadedOrder.visitInfo || {};
                    hl7Result += 'PV1|1|' + (visitInfo.patientClass || 'O') + '|^^^&||||' + (orderInfo.physicianNPI || '1234567893') + '^' + (orderInfo.physicianLastName || 'Jaramillo') + '^' + (orderInfo.physicianFirstName || 'Francisco') + '|||||||||||||||' + (visitInfo.visitNumber || 1) + '|||||||||||||||||||||||||' + resultDateTime + '|' + resultDateTime + '|\r\n';
                    
                    if (uploadedOrder.insuranceInfo && Object.keys(uploadedOrder.insuranceInfo).length > 0) {
                        const insurance = uploadedOrder.insuranceInfo;
                        hl7Result += 'GT1|1||' + patientInfo.lastName + '^' + patientInfo.firstName + '^||' + (patientInfo.address1 !== 'Unknown' ? patientInfo.address1 : '12345 Fake Address Rd.') + '^^' + (patientInfo.city !== 'Unknown' ? patientInfo.city : 'Spring') + '^' + (patientInfo.state !== 'XX' ? patientInfo.state : 'TX') + '^' + (patientInfo.zip !== '00000' ? patientInfo.zip : '77778') + '|' + (patientInfo.phoneHome !== '(000) 000-0000' ? patientInfo.phoneHome : '(832) 454-4545') + '||' + patientInfo.birthDate + '|||01||||||||||||||||\r\n';
                        hl7Result += 'IN1|1||' + (insurance.planId || '60254') + '|' + (insurance.companyName || 'Aetna') + '|^^^AK^|||' + (insurance.groupNumber || '6849878945') + '||||||||' + patientInfo.lastName + '^' + patientInfo.firstName + '^|01|' + patientInfo.birthDate + '|^^^AK^|||1|||||||||||||' + (insurance.policyNumber || '444444') + '|||||||||||T\r\n';
                    }
                    
                    const accessionBase = Math.floor(Math.random() * 900000) + 100000;
                    for (let i = 0; i < labTests.length; i++) {
                        const test = labTests[i];
                        const accessionNumber = resultDateTime.substring(0, 8) + '-' + accessionBase + '-' + String(i + 1).padStart(2, '0');
                        const isFromOriginalOrder = uploadedOrder.originalHL7 && !uploadedOrder.orderInfo.orderNumber.startsWith('RL') && !uploadedOrder.orderInfo.orderNumber.startsWith('ND') && !uploadedOrder.orderInfo.orderNumber.startsWith('RD') && !uploadedOrder.orderInfo.orderNumber.startsWith('R3');
                        const orderControl = isFromOriginalOrder ? 'RE' : 'NW';
                        const orderNumberToUse = orderControl === 'RE' ? uploadedOrder.orderInfo.orderNumber : orderInfo.orderNumber;
                        
                        hl7Result += 'ORC|' + orderControl + '|' + orderNumberToUse + '|' + accessionNumber + '||CM||||' + resultDateTime + '||' + (orderInfo.physicianNPI || '1234567893') + '^' + (orderInfo.physicianLastName || 'Jaramillo') + '^' + (orderInfo.physicianFirstName || 'Francisco') + '^^^^^U|^^^&\r\n';
                        hl7Result += 'OBR|' + (i + 1) + '|' + orderNumberToUse + '|' + accessionNumber + '|' + test.code + '^' + test.name + '|' + (test.priority || 'R') + '||' + resultDateTime + '|' + resultDateTime + '|||^^^|||||BLD&Blood^^Blood Collection Tube (BCT)^^R&Refrigerated|' + (orderInfo.physicianNPI || '1234567893') + '^' + (orderInfo.physicianLastName || 'Jaramillo') + '^' + (orderInfo.physicianFirstName || 'Francisco') + '||||||||F|||||||1^^^^^' + (test.priority || 'R') + '^NONFASTING||\r\n';
                        
                        for (let j = 0; j < test.results.length; j++) {
                            const result = test.results[j];
                            const dataType = (result.code === 'COLOR' || result.code === 'CLARITY') ? 'ST' : 'NM';
                            hl7Result += 'OBX|' + (j + 1) + '|' + dataType + '|' + result.code + '^' + result.name + '^L|' + (j + 1) + '|' + result.value + '|' + result.unit + '|' + result.range + '|' + result.status + '|||F|||' + resultDateTime + '|LAB^Laboratory^L\r\n';
                        }
                    }
                    return hl7Result;
                }

                function handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const content = e.target.result;
                        const result = parseHL7Order(content);
                        if (result.success) {
                            setUploadedOrder(result);
                            setCurrentModule('loaded-info');
                            setGeneratedResult('');
                            const patientKey = result.patientInfo.firstName + '_' + result.patientInfo.lastName + '_' + result.patientInfo.mrn;
                            if (!knownPatients.find(p => p.key === patientKey)) {
                                setKnownPatients(prev => [...prev, { key: patientKey, ...result, displayName: result.patientInfo.firstName + ' ' + result.patientInfo.lastName + ' (' + result.patientInfo.mrn + ')' }]);
                            }
                            alert('✅ HL7 loaded!' + (extractedFiles.length > 0 ? ' Found ' + extractedFiles.length + ' embedded file(s)!' : ''));
                        } else {
                            alert('❌ Error: ' + result.error);
                        }
                    };
                    reader.readAsText(file);
                }

                function handleGenerateResult() {
                    if (!uploadedOrder) return;
                    setGeneratedResult(generateResultHL7());
                    alert('✅ HL7 ORU^R01 generated!');
                }

                function handleDownload() {
                    if (!generatedResult || !uploadedOrder) return;
                    const fileName = generateESTDateTime() + '_' + uploadedOrder.patientInfo.mrn + '_' + uploadedOrder.orderInfo.orderNumber + '_ORU_R01.hl7';
                    const blob = new Blob([generatedResult], { type: 'text/plain' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = fileName;
                    a.click();
                    URL.revokeObjectURL(a.href);
                }

                function generateTestData(orderPrefix, version) {
                    if (!selectedPatient) return;
                    const randomTests = generateRandomTests();
                    const physicianFirstNames = ['Francisco', 'Maria', 'Carlos', 'Ana', 'Diego'];
                    const physicianLastNames = ['Jaramillo', 'Rodriguez', 'Martinez', 'Garcia', 'Lopez'];
                    setUploadedOrder({
                        success: true, patientInfo: selectedPatient.patientInfo,
                        orderInfo: { orderNumber: orderPrefix + Math.floor(Math.random() * 900000 + 100000), sendingApp: 'LightningStep', sendingFacility: '73929332', receivingApp: 'ClinicalLabs', receivingFacility: 'LABLIS', orderDateTime: generateESTDateTime(), controlId: 'CTRL' + Math.floor(Math.random() * 999999999), messageType: 'ORM^O01', processingId: 'P', hl7Version: version, physicianNPI: '12345678' + Math.floor(Math.random() * 10), physicianFirstName: physicianFirstNames[Math.floor(Math.random() * 5)], physicianLastName: physicianLastNames[Math.floor(Math.random() * 5)] },
                        visitInfo: selectedPatient.visitInfo || { patientClass: 'O' }, insuranceInfo: selectedPatient.insuranceInfo || {}, labTests: randomTests, useV23: version === '2.3'
                    });
                    alert('✅ ' + orderPrefix + ' order generated!');
                }

                function renderHeader() {
                    return React.createElement('div', { className: 'header' },
                        React.createElement('h1', null, 'HL7 Results Generator'),
                        React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '1rem' } },
                            React.createElement('p', null, 'Lightning Step - ORU^R01'),
                            React.createElement('span', { className: 'compliance-badge' }, 'LS COMPLIANT'),
                            React.createElement('span', { className: 'file-badge' }, 'PDF/IMG SUPPORT')
                        ),
                        React.createElement('div', { className: 'nav' },
                            React.createElement('button', { className: 'btn-orange', onClick: () => fileInputRef.current.click() }, '📁 Upload HL7'),
                            React.createElement('button', { className: uploadedOrder ? 'btn-indigo' : 'btn-gray', disabled: !uploadedOrder, onClick: () => setCurrentModule('loaded-info') }, 'Loaded Order'),
                            React.createElement('button', { className: extractedFiles.length > 0 ? 'btn-pink' : 'btn-gray', disabled: extractedFiles.length === 0, onClick: () => setCurrentModule('files') }, '📎 Files (' + extractedFiles.length + ')'),
                            React.createElement('button', { className: uploadedOrder ? 'btn-blue' : 'btn-gray', disabled: !uploadedOrder, onClick: () => setCurrentModule('result-from-order') }, 'Result from Order'),
                            React.createElement('button', { className: knownPatients.length > 0 ? 'btn-purple' : 'btn-gray', disabled: knownPatients.length === 0, onClick: () => setCurrentModule('random-tests') }, 'Random (' + knownPatients.length + ')'),
                            React.createElement('button', { className: 'btn-gray', onClick: () => { setCurrentModule('home'); setUploadedOrder(null); setGeneratedResult(''); setSelectedPatient(null); setExtractedFiles([]); } }, 'New')
                        )
                    );
                }

                function renderFiles() {
                    return React.createElement('div', null,
                        React.createElement('h2', { className: 'mb-4' }, '📎 Embedded Files'),
                        extractedFiles.length === 0 ? 
                            React.createElement('div', { className: 'info-card' }, React.createElement('p', null, 'No embedded files found.')) :
                            React.createElement('div', null,
                                extractedFiles.map((file, i) => 
                                    React.createElement('div', { key: i, className: 'file-card' },
                                        React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                                            React.createElement('h4', null, (file.mime.startsWith('image/') ? '🖼️ ' : '📄 ') + file.label + ' #' + file.idx),
                                            React.createElement('div', null,
                                                React.createElement('button', { className: 'btn-blue', style: { marginRight: '0.5rem', padding: '0.5rem 1rem' }, onClick: () => setPreviewFile(previewFile === i ? null : i) }, previewFile === i ? 'Hide' : 'Preview'),
                                                React.createElement('button', { className: 'btn-green', style: { padding: '0.5rem 1rem' }, onClick: () => downloadFile(file) }, 'Download')
                                            )
                                        ),
                                        React.createElement('p', { style: { fontSize: '0.875rem', color: '#6b7280' } }, 'Segment: OBX-' + file.segIdx + ' | Type: ' + file.type + ' | MIME: ' + file.mime + ' | Size: ~' + file.size + 'KB'),
                                        previewFile === i && React.createElement('div', { style: { marginTop: '1rem', background: 'white', padding: '1rem', borderRadius: '8px' } },
                                            file.mime.startsWith('image/') ?
                                                React.createElement('img', { src: 'data:' + file.mime + ';base64,' + file.b64, style: { maxWidth: '100%', maxHeight: '400px', borderRadius: '4px' } }) :
                                                file.mime === 'application/pdf' ?
                                                    React.createElement('iframe', { src: 'data:application/pdf;base64,' + file.b64, style: { width: '100%', height: '400px', border: 'none' } }) :
                                                    React.createElement('p', null, 'Preview not available')
                                        )
                                    )
                                )
                            ),
                        React.createElement('button', { className: 'btn-gray', style: { marginTop: '1rem' }, onClick: () => setCurrentModule('loaded-info') }, '← Back')
                    );
                }

                function renderHome() {
                    return React.createElement('div', { className: 'text-center' },
                        React.createElement('h2', { className: 'mb-8' }, 'Lightning Step Compliant HL7 Generator'),
                        React.createElement('div', { className: 'info-card', style: { background: '#f0fdf4' } },
                            React.createElement('h4', { style: { color: '#166534' } }, '✅ Features'),
                            React.createElement('ul', { style: { textAlign: 'left', marginLeft: '2rem' } },
                                React.createElement('li', null, '🏥 MSH/PID/PV1/ORC/OBR/OBX segments'),
                                React.createElement('li', null, '👤 Race/ethnicity coding (CDCREC)'),
                                React.createElement('li', null, '💳 IN1/GT1 insurance segments'),
                                React.createElement('li', null, '📎 PDF/JPG/PNG extraction from OBX')
                            )
                        ),
                        React.createElement('p', { style: { color: '#6b7280' } }, 'Upload an HL7 file to begin')
                    );
                }

                function renderUploadedOrder() {
                    if (!uploadedOrder) return null;
                    return React.createElement('div', null,
                        React.createElement('h2', { className: 'mb-4' }, 'Loaded Order'),
                        extractedFiles.length > 0 && React.createElement('div', { className: 'file-card', style: { cursor: 'pointer' }, onClick: () => setCurrentModule('files') },
                            React.createElement('h4', null, '📎 ' + extractedFiles.length + ' Embedded File(s) Found - Click to View')
                        ),
                        React.createElement('div', { className: 'info-card' },
                            React.createElement('h4', null, '👤 Patient: ' + uploadedOrder.patientInfo.firstName + ' ' + uploadedOrder.patientInfo.lastName),
                            React.createElement('p', null, 'MRN: ' + uploadedOrder.patientInfo.mrn + ' | DOB: ' + uploadedOrder.patientInfo.birthDate + ' | Gender: ' + uploadedOrder.patientInfo.gender)
                        ),
                        React.createElement('div', { className: 'info-card', style: { background: '#fef3c7' } },
                            React.createElement('h4', { style: { color: '#92400e' } }, '📋 Order: ' + uploadedOrder.orderInfo.orderNumber),
                            React.createElement('p', null, 'Provider: Dr. ' + uploadedOrder.orderInfo.physicianFirstName + ' ' + uploadedOrder.orderInfo.physicianLastName + ' (NPI: ' + uploadedOrder.orderInfo.physicianNPI + ')')
                        ),
                        React.createElement('div', { className: 'info-card', style: { background: '#f0fdf4' } },
                            React.createElement('h4', { style: { color: '#166534' } }, '🧪 Tests: ' + uploadedOrder.labTests.length),
                            React.createElement('ul', { style: { marginLeft: '1rem' } }, uploadedOrder.labTests.map((t, i) => React.createElement('li', { key: i }, t.code + ': ' + t.name)))
                        ),
                        React.createElement('button', { className: 'btn-green', style: { width: '100%', padding: '1rem' }, onClick: handleGenerateResult }, 'Generate HL7 Result')
                    );
                }

                function renderPatientSelector(title, orderPrefix, version) {
                    return React.createElement('div', null,
                        React.createElement('h2', { className: 'mb-4' }, title),
                        React.createElement('div', { className: 'info-card' },
                            React.createElement('h4', null, '👥 Select Patient'),
                            React.createElement('select', { value: selectedPatient ? selectedPatient.key : '', onChange: e => setSelectedPatient(knownPatients.find(p => p.key === e.target.value) || null) },
                                React.createElement('option', { value: '' }, 'Select...'),
                                knownPatients.map(p => React.createElement('option', { key: p.key, value: p.key }, p.displayName))
                            ),
                            React.createElement('button', { className: selectedPatient ? 'btn-green' : 'btn-gray', style: { width: '100%', padding: '1rem' }, disabled: !selectedPatient, onClick: () => generateTestData(orderPrefix, version || '2.3.1') }, 'Generate Random Order'),
                            uploadedOrder && React.createElement('button', { className: 'btn-blue', style: { width: '100%', padding: '1rem', marginTop: '0.5rem' }, onClick: () => { setGeneratedResult(generateResultHL7()); alert('✅ Generated!'); } }, '🔄 Generate HL7 Result')
                        )
                    );
                }

                function renderContent() {
                    if (currentModule === 'files') return renderFiles();
                    if (currentModule === 'loaded-info' && uploadedOrder) return renderUploadedOrder();
                    if (currentModule === 'result-from-order') return uploadedOrder ? React.createElement('div', null, React.createElement('h2', { className: 'mb-4' }, 'Result from Order'), React.createElement('div', { className: 'info-card' }, React.createElement('p', null, 'Patient: ' + uploadedOrder.patientInfo.firstName + ' ' + uploadedOrder.patientInfo.lastName), React.createElement('button', { className: 'btn-green', style: { width: '100%', padding: '1rem', marginTop: '1rem' }, onClick: handleGenerateResult }, 'Generate Result'))) : React.createElement('div', { className: 'info-card' }, React.createElement('p', { style: { color: '#ef4444' } }, '⚠️ Upload an HL7 first'));
                    if (currentModule === 'random-tests') return renderPatientSelector('Random Tests', 'RL', '2.3.1');
                    return renderHome();
                }

                function renderResults() {
                    return React.createElement('div', { className: 'results-section' },
                        React.createElement('h2', { className: 'mb-4' }, 'Generated HL7 Result'),
                        generatedResult && React.createElement('button', { className: 'btn-indigo mb-4', style: { padding: '0.75rem 1.5rem' }, onClick: handleDownload }, 'Download HL7'),
                        React.createElement('div', { className: 'result-display' }, generatedResult || 'Generate a result to see HL7 output...')
                    );
                }

                return React.createElement('div', { className: 'container' },
                    React.createElement('div', { className: 'card' },
                        renderHeader(),
                        React.createElement('input', { ref: fileInputRef, type: 'file', accept: '.hl7,.txt', onChange: handleFileUpload, style: { display: 'none' } }),
                        React.createElement('div', { className: 'content' }, renderContent()),
                        renderResults()
                    )
                );
            }

            createRoot(document.getElementById('root')).render(React.createElement(HL7Generator));
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
        else initApp();
    </script>
</body>
</html>
